name: Nodalia Video Core
version: 0.1.0-alpha.1
slug: nodalia_video_core
description: Stable local video bridge for Home Assistant cameras
url: https://github.com/danielmigueltejedor/apps-nodalia
startup: services
boot: auto
init: false
host_network: true
arch:
  - aarch64
  - amd64
ports:
  8099/tcp: 8099
  1984/tcp: 1984
  8554/tcp: 8554
  8555/tcp: 8555
map:
  - addon_config:rw
  - share:rw
options:
  log_level: info
  cameras: {}
schema:
  log_level: list(debug|info|warning|error)
  cameras: dict
